</style></head><body><div class="shell"><header class="top"><div style="font-weight:700;opacity:.8">GRADE 9 • PYTHON</div><h1>CSC41 | Milestone 3</h1><p>Interactive practice • One question at a time • Instant feedback</p></header><main class="main"><div id="quiz"><div class="meta"><span id="counter"></span><span id="score"></span></div><div class="track"><div class="fill" id="progress"></div></div><h2 class="stem" id="stem"></h2><div id="codearea"></div><div class="options" id="options"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="actions"><button class="btn secondary" id="back">← Previous</button><button class="btn" id="next" disabled>Next question →</button></div></div><div id="results" hidden></div><p class="small">Based on the supplied CSC41 Milestone 3 Practice Questions (30 questions). Answers are shown after selection.</p></main></div><script>
const questions=[{"stem": "A coffee-shop receipt program is shown. Which statement about total and len is correct?", "options": ["Both are built-in functions.", "total is user-defined; len is built-in.", "total is built-in; len is user-defined.", "Both are user-defined because both return values."], "answer": "B", "code": "def total(price, quantity):\n    return price * quantity\n\ncustomer = \"Layla\"\nname_length = len(customer)\nbill = total(4, 3)\nprint(\"Customer:\", customer)\nprint(\"Name length:\", name_length)\nprint(\"Amount due:\", bill)", "ex": "`total()` is defined by the programmer with `def`, while `len()` is provided by Python as a built-in function."}, {"stem": "Which function call is INVALID and would stop the program with a SyntaxError?", "options": ["power(2, 3)", "power(base=2, exp=3)", "power(exp=3, 2)", "power(2, exp=3)"], "answer": "C", "code": "def power(base, exp):\n    return base ** exp", "ex": "Python does not allow a positional argument after a keyword argument in the same call; `power(exp=3, 2)` is invalid syntax."}, {"stem": "A warehouse calculates full cartons and remaining items. Which option lists all and only the built-in functions called within main()?", "options": ["input(), int(), calculate_cartons(), print()", "input(), int(), print(), return", "input(), len(), print()", "input(), int(), print()"], "answer": "D", "code": "def calculate_cartons(item_count, carton_capacity):\n    return item_count // carton_capacity\n\ndef main():\n    item_count = int(input(\"Number of items ready: \"))\n    carton_capacity = int(input(\"Items per carton: \"))\n    full_cartons = calculate_cartons(item_count, carton_capacity)\n    remaining_items = item_count % carton_capacity\n    print(\"Packing summary\")\n    print(\"Full cartons:\", full_cartons)\n    print(\"Items remaining:\", remaining_items)\n    return remaining_items\n\nmain()", "ex": "Inside `main()`, `input()` reads text, `int()` converts it to integers, and `print()` displays results. `calculate_cartons()` is user-defined, and `return` is a keyword."}, {"stem": "A bookkeeping function is called with its first value positionally and income by keyword. What happens when this code runs?", "options": ["2500 is printed", "-2500 is printed", "TypeError (multiple values for argument income)", "SyntaxError"], "answer": "C", "code": "def calculate_balance(income, expenses):\n    return income - expenses\n\nprint(calculate_balance(5000, income=7500))", "ex": "The positional argument 5000 is assigned to income. The keyword argument income=7500 tries to assign income again, so Python raises TypeError: calculate_balance() got multiple values for argument 'income'. The function body is never executed."}, {"stem": "Which complete code segment produces exactly AB-C on one line?", "options": ["aisle=\"A\"; bay=\"B\"; shelf=\"C\"\nprint(aisle, bay, shelf)", "aisle=\"A\"; bay=\"B\"; shelf=\"C\"\nprint(aisle, end=\"\")\nprint(bay, end=\"-\")\nprint(shelf)", "aisle=\"A\"; bay=\"B\"; shelf=\"C\"\nprint(aisle, bay, shelf, sep=\"-\")", "aisle=\"A\"; bay=\"B\"; shelf=\"C\"\nprint(aisle, end=\"-\")\nprint(bay, end=\"\")\nprint(shelf)"], "answer": "B", "code": "", "ex": "`end=\"\"` joins A and B without a space, `end=\"-\"` adds the hyphen, and the last print writes C, producing `AB-C`."}, {"stem": "What is the exact output of this stationery-shop invoice program?", "options": ["Item | Qty | Price\nNotebook | 3 | 12\nTotal: 36 AED\n!", "Item Qty Price\nNotebook 3 12\nTotal: 36 AED!", "Item | Qty | Price\nNotebook | 3 | 12\nTotal 36 AED!", "Item | Qty | Price\nNotebook | 3 | 12\nTotal: 36 AED!"], "answer": "D", "code": "item = \"Notebook\"\nqty = \"3\"\nprice = \"12\"\nprint(\"Item\", \"Qty\", \"Price\", sep=\" | \")\nprint(item, qty, price, sep=\" | \")\nprint(\"Total\", \"36\", sep=\": \", end=\" AED\")\nprint(\"!\")", "ex": "`sep=\" | \"` separates the invoice columns. `end=\" AED\"` prevents a newline, so the final `print(\"!\")` appends the exclamation mark to the same line."}, {"stem": "What appears on the screen?", "options": ["Line1\nLine2", "Line1 Line2", "Line1\n\nLine2", "Line1\\n\\nLine2"], "answer": "C", "code": "print(\"Line1\", end=\"\\n\\n\")\nprint(\"Line2\")", "ex": "`end=\"\\n\\n\"` inserts two newline characters after Line1, leaving one blank line before Line2."}, {"stem": "When the operator enters 29, which code prints exactly Cartons:4; Remaining:5?", "options": ["items = input(\"Items: \")\nprint(\"Cartons:\", items // 6, \"; Remaining:\", items % 6, sep=\"\")", "items = int(input(\"Items: \"))\nprint(\"Cartons:\", items / 6, \"; Remaining:\", items % 6, sep=\"\")", "items = int(input(\"Items: \"))\nprint(\"Cartons:\", items // 6, \"; Remaining:\", items % 6, sep=\"\")", "items = int(input(\"Items: \"))\nprint(\"Cartons:\", items % 6, \";Remaining:\", items // 6, sep=\"\")"], "answer": "C", "code": "", "ex": "`int(input(...))` converts the input to a number. `29 // 6` is 4 full cartons and `29 % 6` is 5 remaining items; `sep=\"\"` avoids extra spaces."}, {"stem": "Which statement displays exactly: Sara said \"The server's down\"?", "options": ["print('Sara said \"The server's down\"')", "print(\"Sara said \"The server's down\"\")", "print('Sara said \"The server\\'s down\"')", "print(\"Sara said 'The server's down'\")"], "answer": "C", "code": "", "ex": "The outer single-quoted string needs the apostrophe in `server\\'s` escaped, while the inner double quotes can remain literal."}, {"stem": "A dispatch label includes a newline and a backslash. Which exact output is correct?", "options": ["Order 42\nZone A\\3\nCharacter count: 17", "Order 42\nZone A\\3\nCharacter count: 18", "Order 42\\nZone A\\3\nCharacter count: 19", "Order 42\nZone A\\3\nCharacter count: 16"], "answer": "A", "code": "label = \"Order 42\\nZone A\\\\3\"\nprint(label)\nprint(\"Character count:\", len(label))", "ex": "`Order 42` has 8 characters, the newline counts as 1, and `Zone A\\3` has 8 including the backslash. Total: 17."}, {"stem": "What is displayed?", "options": ["10 <class 'int'>", "10.0 <class 'float'>", "8.2 <class 'float'>", "TypeError"], "answer": "B", "code": "reading = 8.\nadjustment = 2\nresult = reading + adjustment\nprint(result, type(result))", "ex": "`8.` is a float (8.0), and adding integer 2 produces float `10.0`; `type(result)` reports `<class 'float'>`."}, {"stem": "Which statement about Boolean literals is correct?", "options": ["They can be written in any letter case.", "They are special strings.", "Python has only integer literals 1 and 0 for this purpose.", "They are written True and False, with a capital first letter."], "answer": "D", "code": "door_locked = True\nalarm_on = False", "ex": "Python Boolean literals are `True` and `False`, with capital initial letters. Other spellings are not the Boolean literals."}, {"stem": "What does the program display?", "options": ["<class 'float'>", "<class 'int'>", "<class 'str'>", "SyntaxError"], "answer": "A", "code": "distance = 1e3\nprint(type(distance))", "ex": "`1e3` is scientific notation for 1000.0. Python treats an exponent-form numeric literal as a `float`."}, {"stem": "Which expression evaluates to True?", "options": ["\"10\" == 10", "10 == 10.0", "\"10\" + \"10\" == 20", "10 + 10 == \"20\""], "answer": "B", "code": "", "ex": "Python considers numeric 10 and 10.0 equal in value. The string `\"10\"` is not equal to the number 10."}, {"stem": "Binary 0b10110, octal 0o26 and hexadecimal 0x16 represent the same machine ID. Which code verifies equality and displays its decimal value?", "options": ["sensor_id=\"10110\"; record_id=\"26\"; controller_id=\"16\"\nprint(sensor_id == record_id == controller_id)\nprint(controller_id)", "sensor_id=0b10110; record_id=0o26; controller_id=0x16\nprint(sensor_id == record_id == controller_id)\nprint(controller_id)", "sensor_id=10110; record_id=26; controller_id=16\nprint(sensor_id == record_id == controller_id)\nprint(controller_id)", "sensor_id=0b10110; record_id=0o26; controller_id=0x16\nprint(sensor_id == record_id == controller_id)\nprint(hex(controller_id))"], "answer": "B", "code": "", "ex": "`0b10110`, `0o26`, and `0x16` are all integer 22. Python compares their numeric values and prints integers in decimal by default."}, {"stem": "What does the program display?", "options": ["True True", "False False", "True False", "False True"], "answer": "C", "code": "admin = True\nguest = False\nprint(admin > guest, admin < guest)", "ex": "Booleans behave like 1 (`True`) and 0 (`False`) in numeric comparisons. Thus `True > False` is True and `True < False` is False."}, {"stem": "Which expression produces exactly the string Total: 7?", "options": ["\"Total: \" + 3 + 4", "\"Total: \" + str(3) * 4", "\"Total: \" + 3 + str(4)", "\"Total: \" + str(3 + 4)"], "answer": "D", "code": "", "ex": "`3 + 4` is evaluated first to give 7; `str(7)` converts it to text so it can be concatenated with `\"Total: \"`."}, {"stem": "Select the expected output and correct explanation.", "options": ["22 26 16 — only binary converts to decimal.", "22 22 22 — all three prefixes are recognized and values display in decimal.", "10110 26 16 — prefixes are removed without conversion.", "22 22 16 — hexadecimal digits are treated as decimal 16."], "answer": "B", "code": "device_a = 0b10110\ndevice_b = 0o26\ndevice_c = 0x16\nprint(device_a, device_b, device_c)", "ex": "All three literals represent decimal 22. `print()` displays each integer as `22`, regardless of whether it was written in binary, octal, or hexadecimal."}, {"stem": "What value is displayed?", "options": ["512", "64", "36", "128"], "answer": "A", "code": "level = 2 ** 3 ** 2\nprint(level)", "ex": "Exponentiation groups from right to left: `3 ** 2` is 9, then `2 ** 9` is 512."}, {"stem": "Trace the code. What value is displayed?", "options": ["5", "10.0", "5.0", "7.0"], "answer": "C", "code": "bonus = 10 - 4 / 2 * 3 + 1\nprint(bonus)", "ex": "Division and multiplication happen before addition and subtraction, from left to right: `4 / 2 * 3` is 6.0; `10 - 6.0 + 1` is 5.0."}, {"stem": "18 packages: remove 3 damaged packages, double the remainder, then count fully loaded vans of 4. Which code works?", "options": ["packages = 18\npackages -= 3\npackages *= 2\npackages //= 4\nprint(packages)", "packages = 18\npackages -= 3\npackages *= 2\npackages /= 4\nprint(packages)", "packages = 18\npackages -= 3\npackages *= 2\npackages //= 3\nprint(packages)", "packages = 18\npackages -= 3\npackages //= 4\npackages *= 2\nprint(packages)"], "answer": "A", "code": "", "ex": "After removing 3 packages, 15 remain. Doubling gives 30 packages, and `30 // 4` gives 7 fully loaded vans."}, {"stem": "Which statement displays exactly Ana is 21 (single spaces)?", "options": ["print(name + \" is \" + age)", "print(name, \" is \", age)", "print(name + \" is \" + str(age))", "print(name + \" is \", + age)"], "answer": "C", "code": "name = \"Ana\"\nage = 21", "ex": "`age` is an integer, so it must be converted with `str(age)` before concatenation with strings using `+`."}, {"stem": "Which code produces exactly Total:55! on one line?", "options": ["label=\"Total:\"\nunits=str(5)*2\nprint(label+units+\"!\")", "label=\"Total:\"\nunits=str(5*2)\nprint(label+units+\"!\")", "label=\"Total:\"\nunits=str(5)*2\nprint(label, units, \"!\")", "label=\"Total:\"\nunits=str(5)*2\nprint(label+\" \"+units+\"!\")"], "answer": "A", "code": "", "ex": "`str(5) * 2` repeats the character `5` twice to form `55`; concatenating `Total:` and `!` gives `Total:55!` without spaces."}, {"stem": "Which statement prints the numeric total 8?", "options": ["print(x + y)", "print(x * y)", "print(str(x) + str(y))", "print(int(x) + y)"], "answer": "D", "code": "x = \"5\"\ny = 3", "ex": "`x` contains text `\"5\"`. `int(x)` converts it to number 5, and `5 + 3` prints numeric 8."}, {"stem": "Which statement about commenting several lines in Python is accurate?", "options": ["/* ... */ blocks are ignored by the interpreter.", "A # comment must always be on its -size:45px">🎓</div><h2>Practice completed!</h2><div class="score">${score} / ${questions.length}</div><p>${Math.round(score/questions.length*100)}% correct • ${questions.length-score} incorrect</p><p>Review your mistakes and try again to improve your score.</p><button class="btn" id="retry">Try again</button></div>`;$('retry').onclick=()=>{selections.fill(null);current=0;$('results').hidden=true;$('quiz').hidden=false;render()}}render();
